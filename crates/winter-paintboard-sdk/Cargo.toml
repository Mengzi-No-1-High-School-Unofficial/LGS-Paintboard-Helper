[package]
name = "winter-paintboard-sdk"
version = "0.1.0"
edition = "2021"
description = "SDK for LGS Winter Paintboard 2026 API"
authors = ["Xyber Nova <xyber-nova@outlook.com>"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
tokio-util = "0.7"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.0"
thiserror = "1.0"
log = "0.4"
url = "2.0"
reqwest = { version = "0.11", features = ["json"] }
rand = "0.8"
uuid = { version = "1.0", features = ["v4"] }
async-trait = "0.1"
governor = { version = "0.6", features = ["std"] }
tracing = "0.1.41"
deadpool = { version = "0.12.3", features = ["rt_tokio_1"] }
color-eyre = "0.6.5"
once_cell = "1.21.3"
dashmap = "6.1.0"
rustc-hash.workspace = true

[dev-dependencies]
tokio-test = "0.4"
