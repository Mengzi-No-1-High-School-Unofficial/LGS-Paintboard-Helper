[package]
name = "lgs-paintboard"
version = "0.1.0"
edition = "2021"
description = "一个用于在 LGS 冬日绘板上绘画的小工具"
authors = ["Xyber Nova <xyber-nova@outlook.com>"]
license = "AGPL-3.0-only"
 
[workspace]
members = [
    "crates/winter-paintboard-sdk",
]

[dependencies]
clap = { workspace = true }
image = { workspace = true }
imageproc = { version = "0.23" }
tokio = { workspace = true, features = ["tracing"] }
winter-paintboard-sdk = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
rustc-hash = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot.workspace = true
console-subscriber = "0.4.1"
dashmap = "5.5"
color-eyre = "0.6.5"
once_cell = "1.21.3"
rand = "0.9.2"
openssl = { version = "0.10.75", features = ["vendored"] }

[workspace.dependencies]
clap = { version = "4.0", features = ["derive"] }
image = { version = "0.24", features = ["png"] }
tokio = { version = "1.0", features = ["full"] }
winter-paintboard-sdk = { path = "crates/winter-paintboard-sdk" }
log = "0.4"
env_logger = "0.10"
rustc-hash = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
