name: Rust

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Debug
        run: cargo build
      
      - name: Build Release
        run: cargo build --release

      - name: Upload a Debug Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: lgs-paintboard
          path: ./target/debug/lgs-paintboard
        
      - name: Upload a Release Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: lgs-paintboard
          path: ./target/release/lgs-paintboard
